# 模型 → 厂商 → 任务类型路由表
# /v1/models 返回此列表
# Gateway 按 model 名查找 vendor + taskType，决定走同步还是异步流程
# rateLimit 可选: qps(每秒请求数) + concurrency(最大并发)

models:
  # ===== 对话 =====
  - name: gpt-4o-web
    vendor: chatgpt
    taskType: chat
    description: "ChatGPT 网页端 (GPT-4o)"
    rateLimit:
      qps: 0.5
      concurrency: 3

  - name: gpt-4o-mini-web
    vendor: chatgpt
    taskType: chat
    description: "ChatGPT 网页端 (GPT-4o mini)"

  # ===== 视频分析 =====
  - name: chatgpt-web
    vendor: chatgpt
    taskType: analyze
    description: "ChatGPT 视频分析 (GPT-4o)"
    rateLimit:
      qps: 0.1
      concurrency: 4
