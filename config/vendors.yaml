# 厂商能力声明
# Agent 按 vendor 加载对应适配器，按 capabilities 确定支持的任务类型

vendors:
  chatgpt:
    url: https://chatgpt.com
    capabilities: [chat]
    adapter: chatgpt.js

  claude:
    url: https://claude.ai
    capabilities: [chat]
    adapter: claude.js

  gemini:
    url: https://gemini.google.com/app
    capabilities: [chat, image]
    adapter: gemini.js

  doubao:
    url: https://www.doubao.com/chat
    capabilities: [chat]
    adapter: doubao.js

  jimeng:
    url: https://jimeng.jianying.com/ai-tool/image/generate
    capabilities: [image, video]
    adapter: jimeng.js

  kling:
    url: https://kling.kuaishou.com
    capabilities: [video]
    adapter: kling.js
