# 各厂商 DOM 选择器配置
# Agent 每 60s 热加载此文件，修改后无需重启即生效
# 选择器失效是网页端自动化的头号故障原因，热加载是必须的

# ===== ChatGPT =====
chatgpt:
  input: "#prompt-textarea"
  sendButton: "button[data-testid='send-button']"
  stopButton: "button[data-testid='stop-button']"
  assistantMessage: "[data-message-author-role='assistant']"
  newChatButton: "a[href='/']"
  rateLimitIndicators: ["You've reached", "rate limit"]
  sendStrategy: clipboard
  loginCheck:
    # ChatGPT 改版后 account-menu-button testid 失效，改用侧边栏开关按钮（登录后主界面才有）
    loggedIn: "button[aria-label='Open sidebar'], button[aria-label='Close sidebar'], [data-testid='close-sidebar-button']"
    loggedOut: "button[data-testid='login-button'], button[data-testid='signup-button'], a[href*='/auth/login'], a[href*='login']"
