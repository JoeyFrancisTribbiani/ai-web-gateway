<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ai-web-gateway 管理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
  .nav { background: #1e293b; padding: 12px 24px; display: flex; gap: 24px; align-items: center; border-bottom: 1px solid #334155; }
  .nav h1 { font-size: 18px; color: #38bdf8; }
  .nav a { color: #94a3b8; text-decoration: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  .nav a:hover { background: #334155; color: #e2e8f0; }
  .nav a.active { background: #0ea5e9; color: #fff; }
  .container { padding: 24px; max-width: 1200px; margin: 0 auto; }
  .grid { display: grid; gap: 16px; }
  .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .stat { background: #0f172a; border-radius: 8px; padding: 16px; border: 1px solid #334155; }
  .stat-label { font-size: 12px; color: #64748b; text-transform: uppercase; }
  .stat-value { font-size: 24px; font-weight: 700; color: #38bdf8; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #334155; font-size: 13px; }
  th { color: #64748b; font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-green { background: #064e3b; color: #34d399; }
  .badge-red { background: #7f1d1d; color: #f87171; }
  .badge-yellow { background: #78350f; color: #fbbf24; }
  .badge-blue { background: #0c4a6e; color: #38bdf8; }
  .btn { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; }
  .btn-primary { background: #0ea5e9; color: #fff; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-sm { padding: 3px 8px; font-size: 11px; }
  textarea { width: 100%; height: 400px; background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 13px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="nav">
  <h1>ai-web-gateway</h1>
  <a onclick="showPage('dashboard')" class="active" id="nav-dashboard">仪表盘</a>
  <a onclick="showPage('agents')" id="nav-agents">Agent</a>
  <a onclick="showPage('login')" id="nav-login">账号管理</a>
  <a onclick="showPage('config')" id="nav-config">配置编辑</a>
  <a onclick="showPage('tasks')" id="nav-tasks">任务历史</a>
  <a onclick="showPage('videos')" id="nav-videos">视频任务</a>
</div>
<div class="container">
  <div id="page-dashboard" class="grid"></div>
  <div id="page-agents" class="hidden"></div>
  <div id="page-login" class="hidden"></div>
  <div id="page-config" class="hidden"></div>
  <div id="page-tasks" class="hidden"></div>
  <div id="page-videos" class="hidden"></div>
</div>

<script>
const API = '';
let apiKey = localStorage.getItem('apiKey') || '';
if (!apiKey) { apiKey = prompt('请输入 API_KEY'); localStorage.setItem('apiKey', apiKey); }

async function api(path, method = 'GET', body = null) {
  const opts = { method, headers: { 'Authorization': `Bearer ${apiKey}` } };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(API + path, opts);
  return r.json();
}

function showPage(name) {
  document.querySelectorAll('[id^="page-"]').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll('[id^="nav-"]').forEach(el => el.classList.remove('active'));
  document.getElementById('page-' + name).classList.remove('hidden');
  document.getElementById('nav-' + name).classList.add('active');
  if (name === 'dashboard') loadDashboard();
  if (name === 'agents') loadAgents();
  if (name === 'login') loadLogin();
  if (name === 'config') loadConfig();
  if (name === 'tasks') loadTasks();
  if (name === 'videos') loadVideos();
}

async function loadDashboard() {
  const [dash, health] = await Promise.all([api('/admin/dashboard'), api('/health')]);
  const el = document.getElementById('page-dashboard');
  let html = '<div class="stat-grid">';
  html += stat('Agent 在线', `${health.agents.online}/${health.agents.total}`);
  html += stat('空闲 Agent', health.agents.idle);
  html += stat('视频队列', health.videoQueue);
  html += stat('文件存储', `${health.fileStorage.usedMB} MB`);
  html += stat('运行时间', `${Math.round(health.uptime / 60)} min`);
  html += '</div>';

  html += '<div class="card"><h3>厂商统计</h3><table><tr><th>厂商</th><th>请求数</th><th>成功率</th><th>均耗时</th><th>登录态</th></tr>';
  for (const [vendor, s] of Object.entries(dash.stats || {})) {
    const login = health.loginSummary[vendor] || 'unknown';
    const badge = login === 'ok' ? 'badge-green' : login === 'degraded' ? 'badge-yellow' : 'badge-red';
    html += `<tr><td>${vendor}</td><td>${s.total}</td><td><span class="badge ${s.successRate > 90 ? 'badge-green' : s.successRate > 70 ? 'badge-yellow' : 'badge-red'}">${s.successRate}%</span></td><td>${s.avgLatency}ms</td><td><span class="badge ${badge}">${login}</span></td></tr>`;
  }
  html += '</table></div>';
  el.innerHTML = html;
}

async function loadAgents() {
  const agents = await api('/admin/agents');
  const el = document.getElementById('page-agents');
  let html = '<div class="card"><table><tr><th>Agent ID</th><th>状态</th><th>厂商</th><th>Tabs</th><th>视频轮询</th><th>任务数</th><th>内存</th><th>当前任务</th><th>操作</th></tr>';
  for (const a of agents) {
    const badge = a.isOnline ? (a.status.includes('idle') ? 'badge-green' : 'badge-yellow') : 'badge-red';
    html += `<tr><td>${a.agentId}</td><td><span class="badge ${badge}">${a.status}</span></td><td>${a.vendors.join(', ')}</td><td>${a.activeTabs}</td><td>${a.videoPolling}</td><td>${a.taskCount}</td><td>${a.resources?.chromeMemoryMB || 0}MB</td><td>${a.currentTask ? a.currentTask.vendor + ' ' + a.currentTask.model : '-'}</td><td><button class="btn btn-primary btn-sm" onclick="restartAgent('${a.agentId}')">重启</button></td></tr>`;
  }
  html += '</table></div>';
  el.innerHTML = html;
}

async function loadLogin() {
  const status = await api('/admin/login-status');
  const el = document.getElementById('page-login');
  const vendors = ['chatgpt','claude','gemini','doubao','jimeng','kling'];
  let html = '<div class="card"><table><tr><th>Agent</th>';
  for (const v of vendors) html += `<th>${v}</th>`;
  html += '</tr>';
  for (const [agentId, info] of Object.entries(status)) {
    html += `<tr><td>${agentId}</td>`;
    for (const v of vendors) {
      const s = info.loginStatus[v];
      if (!info.vendors.includes(v)) { html += '<td>-</td>'; continue; }
      if (s === 'logged_in') html += '<td><span class="badge badge-green">已登录</span></td>';
      else if (s === 'logged_out') html += `<td><span class="badge badge-red">未登录</span> <button class="btn btn-primary btn-sm" onclick="loginAgent('${agentId}','${v}')">登录</button></td>`;
      else html += `<td><span class="badge badge-yellow">${s || '未知'}</span></td>`;
    }
    html += '</tr>';
  }
  html += '</table></div>';
  el.innerHTML = html;
}

async function loadConfig() {
  const el = document.getElementById('page-config');
  el.innerHTML = `
    <div class="card">
      <select id="config-name" onchange="loadConfigContent()">
        <option value="selectors">selectors.yaml</option>
        <option value="models">models.yaml</option>
        <option value="vendors">vendors.yaml</option>
      </select>
      <button class="btn btn-primary" onclick="saveConfig()">保存</button>
      <button class="btn btn-sm" onclick="showSelectorHistory()">选择器版本</button>
      <br><br>
      <textarea id="config-content"></textarea>
      <div id="config-history" class="hidden"><br><div id="history-list"></div></div>
    </div>`;
  loadConfigContent();
}

async function loadConfigContent() {
  const name = document.getElementById('config-name').value;
  const r = await api(`/admin/config/${name}`);
  document.getElementById('config-content').value = r.content || '';
}

async function saveConfig() {
  const name = document.getElementById('config-name').value;
  const content = document.getElementById('config-content').value;
  const r = await api(`/admin/config/${name}`, 'PUT', { content });
  alert(r.message || r.error);
}

async function showSelectorHistory() {
  const history = await api('/admin/config/selectors/history');
  const el = document.getElementById('config-history');
  el.classList.remove('hidden');
  let html = '<table><tr><th>版本</th><th>时间</th><th>操作</th></tr>';
  for (const h of history) {
    html += `<tr><td>${h.version}</td><td>${h.date}</td><td><button class="btn btn-danger btn-sm" onclick="rollbackSelector('${h.version}')">回滚</button></td></tr>`;
  }
  html += '</table>';
  document.getElementById('history-list').innerHTML = html;
}

async function rollbackSelector(version) {
  if (!confirm(`回滚到 ${version}?`)) return;
  const r = await api(`/admin/config/selectors/rollback/${version}`, 'POST');
  alert(r.message || r.error);
}

async function loadTasks() {
  const tasks = await api('/admin/tasks');
  const el = document.getElementById('page-tasks');
  let html = '<div class="card"><table><tr><th>请求ID</th><th>模型</th><th>厂商</th><th>类型</th><th>状态</th><th>耗时</th></tr>';
  for (const t of tasks) {
    const badge = t.status === 'success' ? 'badge-green' : 'badge-red';
    html += `<tr><td>${t.requestId?.slice(0, 12)}</td><td>${t.model}</td><td>${t.vendor}</td><td>${t.taskType}</td><td><span class="badge ${badge}">${t.status}</span></td><td>${t.latency}ms</td></tr>`;
  }
  html += '</table></div>';
  el.innerHTML = html;
}

async function loadVideos() {
  const tasks = await api('/admin/video-tasks?pageSize=50');
  const el = document.getElementById('page-videos');
  let html = '<div class="card"><table><tr><th>任务ID</th><th>状态</th><th>进度</th><th>Agent</th><th>耗时</th><th>操作</th></tr>';
  for (const t of tasks) {
    const badge = t.status === 'completed' ? 'badge-green' : t.status === 'failed' ? 'badge-red' : t.status === 'cancelled' ? 'badge-yellow' : 'badge-blue';
    const duration = t.createdAt ? Math.round((Date.now() - t.createdAt) / 1000) + 's' : '-';
    html += `<tr><td>${t.id?.slice(0, 12)}</td><td><span class="badge ${badge}">${t.status}</span></td><td>${t.progress || 0}%</td><td>${t.agentId?.slice(0, 10) || '-'}</td><td>${duration}</td>`;
    if (t.status === 'generating' || t.status === 'queued') {
      html += `<td><button class="btn btn-danger btn-sm" onclick="cancelVideo('${t.id}')">取消</button></td>`;
    } else if (t.status === 'completed' && t.videoUrl) {
      html += `<td><a href="${t.videoUrl}" target="_blank" class="btn btn-primary btn-sm">查看</a></td>`;
    } else { html += '<td>-</td>'; }
    html += '</tr>';
  }
  html += '</table></div>';
  el.innerHTML = html;
}

async function restartAgent(agentId) {
  if (!confirm(`重启 ${agentId}?`)) return;
  await api(`/admin/agents/${agentId}/restart`, 'POST');
  alert('重启信号已发送');
  loadAgents();
}

async function loginAgent(agentId, vendor) {
  const r = await api(`/admin/login/${agentId}/${vendor}`, 'POST');
  if (r.vncPort) {
    alert(`VNC 已开启，端口 ${r.vncPort}\n请用 VNC 客户端连接服务器:${r.vncPort}`);
  } else {
    alert(r.message || '登录模式已开启');
  }
}

async function cancelVideo(taskId) {
  await api(`/admin/video-tasks/${taskId}/cancel`, 'POST');
  loadVideos();
}

function stat(label, value) {
  return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`;
}

// 初始加载
loadDashboard();
// 每 10s 刷新仪表盘
setInterval(() => {
  if (!document.getElementById('page-dashboard').classList.contains('hidden')) loadDashboard();
}, 10000);
</script>
</body>
</html>
